server {
    listen 80 default_server;
    server_name _;
    # 客户端旧下载器只支持 80 端口;API 统一反代 Go 8082
    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
    }
    # /h62/pl/<seg>/<file> -> Go /pl/<file>(格式串双 %s 的规范化)
    location ~ ^/[^/]+/pl/[^/]+/(.+)$ {
        proxy_pass http://127.0.0.1:8082/pl/$1;
        proxy_set_header Host $host;
    }
    # /<proj>/game_notice/<file> -> /game_notice/<file>
    location ~ ^/[^/]+/game_notice/(.+)$ {
        proxy_pass http://127.0.0.1:8082/game_notice/$1;
        proxy_set_header Host $host;
    }
    # 资源下载:客户端旧下载器会丢掉 URL 端口连 80(Host 也不带端口),
    # 故同一资源路径在 80 上必须可下(Range 由 nginx 静态模块原生支持);
    # 8083 保持不变,双端口等效。
    location /patch_pub.android_1.0.128a588/ {
        alias /opt/hs-res/patch_pub.android_1.0.128a588/;
    }
}
server {
    listen 8083;
    server_name _;
    root /opt/hs-res;
    autoindex off;
    sendfile on;
    tcp_nopush on;
    directio 512;
}
