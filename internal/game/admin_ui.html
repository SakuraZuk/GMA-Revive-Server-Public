<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>幻书管理</title>
<style>body{font:16px system-ui;background:#edf2f6;color:#183041;margin:0}main{max-width:1050px;margin:30px auto;padding:30px;background:white;border-radius:12px}label{display:block;margin:12px 0}input,textarea,select,button{font:inherit;box-sizing:border-box;padding:10px;border:1px solid #becbd5;border-radius:6px;width:100%}button{background:#174d6e;color:white;cursor:pointer}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow:auto;max-height:400px;background:#eef3f6;padding:15px}small{color:#566c7a}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}textarea{min-height:200px}.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}section{border-top:1px solid #d5e0e8;margin-top:25px;padding-top:15px}canvas{width:100%;background:#f6f9fb;border:1px solid #d5e0e8}#players button{background:#eef3f6;color:#183041;text-align:left;margin:4px 0}[hidden]{display:none!important}@media(max-width:700px){.grid{grid-template-columns:1fr}main{margin:0;padding:18px}}</style>
<main><h1>幻书管理</h1><p>查询玩家存档，修改资料或发放资产。每次修改填写收据、操作员和原因。</p>
<div class="row"><label>管理令牌<input id="token" type="password" autocomplete="off"></label><button id="lock">清除令牌</button></div><small>令牌只保留在当前页面内存。</small>
<section><h2>玩家</h2><div class="row"><input id="search" placeholder="昵称、馆主编号或角色编号"><button id="find">查询玩家</button></div><div id="players"></div><div class="row"><label>角色编号<input id="oid" maxlength="24" placeholder="24位角色编号"></label><button id="detail">读取存档与审计</button></div></section>
<section><h2>修改与发放</h2><div class="grid"><div><label>操作<select id="action"><option value="profile">修改昵称、等级或性别</option><option value="material_add">增加材料</option><option value="material_set">设置材料余额</option><option value="card_grant">发放幻书</option><option value="recommendation_issue">发行推荐礼包报价</option><option value="rune">发放契印</option><option value="mail">发送邮件</option></select></label><label>收据<input id="receipt" maxlength="100" placeholder="每次操作使用独立收据"></label><label>操作员<input id="operator" maxlength="64"></label><label>原因<input id="reason" maxlength="512"></label></div><div>
<div id="profile-fields"><label>昵称<input id="nickname" placeholder="留空保持原值"></label><label>馆主等级<input id="level" type="number" min="0" value="0"></label><label>性别<select id="gender"><option value="0">保持原值</option><option value="1">男</option><option value="2">女</option></select></label></div>
<div id="material-fields" hidden><label>材料编号<input id="material" type="number" min="1"></label><label>数量<input id="amount" inputmode="numeric" value="1"></label></div>
<div id="card-fields" hidden><label>幻书编号<input id="card" type="number" min="1"></label><label>数量<input id="count" type="number" min="1" max="50" value="1"></label></div>
<div id="offer-fields" hidden><label>推荐编号<input id="offer-id" type="number" min="1"></label><label>商品编号<input id="offer-commodity" type="number" min="1" value="8010001"></label><label>单价<input id="offer-price" type="number" min="1" value="648"></label><label>展示期限（分钟）<input id="offer-duration" type="number" min="1" max="1440" value="120"></label><label>未展示报价失效时间<input id="offer-expired" type="datetime-local"></label></div>
<div id="payload-fields" hidden><label>邮件或契印内容<textarea id="payload" spellcheck="false"></textarea></label></div><p id="help"></p></div></div><button id="submit">保存并记录审计</button><pre id="result" role="status">尚未执行</pre></section>
<section><h2>战斗观察记录</h2><small>展示当前会话保留的观察事件，最多128条。记录可能截断，不代表完整录像；不改变战斗结果。</small><div class="row"><button id="play">播放</button><input id="timeline" type="range" min="0" max="0" value="0"><span id="event-label">请先读取玩家存档</span></div><canvas id="battle" width="950" height="420"></canvas><pre id="event"></pre></section>
</main><script src="/admin/ui.js"></script></html>
